services:
  mcp-ipm:
    image: ghcr.io/neto-developer/mcp-ipm:latest
    build: .
    env_file: .env
    stdin_open: true
    tty: true
    ports:
      - "${MCP_HTTP_PORT:-3000}:${MCP_HTTP_PORT:-3000}"
    networks:
      - argonsolar-network

networks:
  argonsolar-network:
    external: true
    name: infra_argonsolar-network
